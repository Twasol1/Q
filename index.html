<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<meta name="description" content="ألواح شمسية، بطاريات، إنفرترات وحلول طاقة موثوقة. تواصل معنا عبر واتساب.">
<title>SAFETY — حلول الطاقة الشمسية</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c));return e};
const app=document.getElementById('app');
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();
let cfg={name:'SAFETY',tagline:'حلول طاقة شمسية موثوقة',whatsapp:'',cats:[]},prods=[],q='',cat='',loaded=false;
const safeImg=u=>/^(data:image\/|https:\/\/)/.test(u||'')?'url("'+u.replace(/["\\\n]/g,'')+'")':'';
const wa=txt=>cfg.whatsapp?'https://wa.me/'+String(cfg.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent(txt):null;

db.doc('config/site').onSnapshot(s=>{if(s.exists)cfg={...cfg,...s.data()};draw()},()=>draw());
db.collection('products').orderBy('createdAt','desc').onSnapshot(s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;draw()},()=>{loaded=true;draw()});
window.addEventListener('hashchange',()=>{scrollTo(0,0);draw()});

function draw(){
  document.title=cfg.name+' — '+cfg.tagline;
  app.replaceChildren();
  const m=location.hash.match(/^#\/p\/(.+)$/);
  m?drawProduct(decodeURIComponent(m[1])):drawHome();
}
function footer(){const l=wa('مرحباً، أحتاج استشارة');return h('div',{class:'pad muted'},l?h('a',{class:'btn wa',href:l,target:'_blank',rel:'noopener'},'تواصل عبر واتساب'):'',h('span',{},'© '+cfg.name))}

function drawHome(){
  const grid=h('div',{class:'grid'}),chips=h('div',{class:'chips'});
  const l=wa('مرحباً، أريد الاستفسار عن منتجاتكم');
  const search=h('input',{type:'search',placeholder:'ابحث عن منتج…',value:q,'aria-label':'بحث'});
  search.addEventListener('input',()=>{q=search.value;fill()});
  function fill(){
    chips.replaceChildren(...['',...cfg.cats].map(c=>h('button',{class:c===cat?'on':'',onclick:()=>{cat=c;fill()}},c||'الكل')));
    const list=prods.filter(p=>(!cat||p.cat===cat)&&(!q||(p.name+' '+p.desc).includes(q)));
    grid.replaceChildren(...list.map(p=>h('a',{class:'card',href:'#/p/'+encodeURIComponent(p.id)},
      h('div',{class:'im',style:'background-image:'+safeImg(p.img),role:'img','aria-label':p.name}),
      h('div',{class:'t'},h('b',{},p.name),h('span',{class:'price'},p.price||''),p.available===false?h('span',{class:'muted'},'غير متوفر'):''))));
    if(!list.length)grid.replaceChildren(h('p',{class:'muted'},loaded?'لا توجد منتجات مطابقة.':'جارٍ التحميل…'));
  }
  app.append(h('header',{class:'hero'},h('h1',{},cfg.name),h('p',{},cfg.tagline),l?h('a',{class:'btn',href:l,target:'_blank',rel:'noopener'},'اطلب عبر واتساب'):''),
    h('main',{class:'pad'},search,chips,grid),footer());
  fill();
}
function drawProduct(id){
  const p=prods.find(x=>x.id===id);
  const l=p&&wa('مرحباً، أريد طلب/الاستفسار عن: '+p.name);
  app.append(h('header',{class:'top'},h('a',{href:'#/','aria-label':'رجوع'},'→'),p?p.name:'المنتج'),
    h('main',{class:'pad'},p?[h('div',{class:'big',style:'background-image:'+safeImg(p.img)}),h('h2',{},p.name),h('div',{class:'price'},p.price||''),
      h('p',{style:'white-space:pre-wrap'},p.desc||''),p.available===false?h('p',{class:'err'},'غير متوفر حالياً'):'',
      l?h('a',{class:'btn wa',href:l,target:'_blank',rel:'noopener'},'اطلب عبر واتساب'):''
    ]:h('p',{class:'muted'},loaded?'المنتج غير موجود.':'جارٍ التحميل…')),footer());
}
</script>
</body>
</html>
