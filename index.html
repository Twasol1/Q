<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر الطاقة الشمسية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#f4f7f4;color:#1b2b1b;padding-bottom:70px}
header{background:#0b6b3a;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header button{background:#fff;color:#0b6b3a;border:0;border-radius:8px;padding:6px 10px;margin-inline-start:6px;font-weight:700}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px}nav button{border:1px solid #0b6b3a;background:#fff;color:#0b6b3a;border-radius:20px;padding:6px 14px;white-space:nowrap}
nav button.on{background:#0b6b3a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0002;display:flex;flex-direction:column}
.card img{width:100%;height:120px;object-fit:cover;background:#dde}.card div{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{color:#0b6b3a;font-weight:800}.card small{color:#555}
.card button{margin-top:auto;border:0;background:#f5a623;border-radius:8px;padding:8px;font-weight:700}
.card button:disabled{background:#ccc}
#bar{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#fff;box-shadow:0 -2px 6px #0003}
#send{width:100%;border:0;background:#25d366;color:#fff;font-size:16px;font-weight:700;padding:12px;border-radius:10px}
</style></head><body>
<header><b id="ttl"></b><span><button id="lang">EN</button><button id="cur">USD</button></span></header>
<nav id="cats"></nav><main id="list" class="grid"></main>
<div id="bar"><button id="send"></button></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.firestore();
let L='ar',C='USD',cat='all',P=[],S={wa:'',rate:15000},cart={};
const T={ar:{ttl:'☀️ متجر الطاقة الشمسية',all:'الكل',panel:'ألواح',battery:'بطاريات',inverter:'انفرترات',add:'أضف للطلب',out:'غير متوفر',send:'أرسل الطلب عبر واتساب',hi:'مرحباً، أريد طلب:',tot:'المجموع',empty:'اختر منتجات أولاً'},
en:{ttl:'☀️ Solar Shop',all:'All',panel:'Panels',battery:'Batteries',inverter:'Inverters',add:'Add to order',out:'Out of stock',send:'Send order via WhatsApp',hi:'Hello, I would like to order:',tot:'Total',empty:'Pick products first'}};
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const img=u=>/^https?:\/\//.test(u||'')?e(u):'';
const money=v=>C==='USD'?'$'+(+v).toLocaleString('en'):Math.round(v*S.rate).toLocaleString('en')+(L==='ar'?' ل.س':' SYP');
const nm=p=>p['name_'+L]||p.name_ar||p.name_en||'';
function render(){const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
ttl.textContent=t.ttl;lang.textContent=L==='ar'?'EN':'عربي';cur.textContent=C==='USD'?(L==='ar'?'ل.س':'SYP'):'USD';
cats.innerHTML=['all','panel','battery','inverter'].map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${t[c]}</button>`).join('');
list.innerHTML=P.filter(p=>cat==='all'||p.cat===cat).map(p=>`<div class="card"><img src="${img(p.img)}" alt=""><div><b>${e(nm(p))}</b><small>${e(p['desc_'+L]||'')}</small><span class="price">${money(p.price)}</span><button data-id="${e(p.id)}" ${p.inStock===false?'disabled':''}>${p.inStock===false?t.out:t.add+(cart[p.id]?' ('+cart[p.id]+')':'')}</button></div></div>`).join('');
send.textContent=t.send}
cats.onclick=ev=>{if(ev.target.dataset.c){cat=ev.target.dataset.c;render()}};
list.onclick=ev=>{const id=ev.target.dataset.id;if(id){cart[id]=(cart[id]||0)+1;render()}};
lang.onclick=()=>{L=L==='ar'?'en':'ar';render()};cur.onclick=()=>{C=C==='USD'?'SYP':'USD';render()};
send.onclick=()=>{const ids=Object.keys(cart);if(!ids.length)return alert(T[L].empty);let sum=0;
const lines=ids.map(id=>{const p=P.find(x=>x.id===id);if(!p)return '';sum+=p.price*cart[id];return `- ${nm(p)} × ${cart[id]} = ${money(p.price*cart[id])}`}).filter(Boolean);
const msg=`${T[L].hi}\n${lines.join('\n')}\n${T[L].tot}: ${money(sum)}`;
location.href='https://wa.me/'+String(S.wa).replace(/\D/g,'')+'?text='+encodeURIComponent(msg)};
db.doc('settings/main').onSnapshot(d=>{if(d.exists)S=Object.assign(S,d.data());render()},()=>{});
db.collection('products').onSnapshot(q=>{P=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
render();
</script></body></html>
